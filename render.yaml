services:
  - type: web
    name: football-game
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server/render.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: "*"
